services:
  discord-bot:
    build:
      context: ./app
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./app/src:/app/src
      - ./app/.env:/app/.env:ro
      - ./app/keys:/app/keys:ro
      # config_store.json 等の設定を保存する。コンテナを作り直しても /setup の設定が消えないようにする
      - ./app/data:/app/data
    command:
      - watchfiles
      - --target-type=command
      - --verbosity=info
      - "python -u src/main.py"
      - /app/src
      - /app/.env
    env_file:
      - ./app/.env
    environment:
      DATA_DIR: /app/data
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"